name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-check:
    name: repository-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check required files
        run: |
          test -s .github/PULL_REQUEST_TEMPLATE.md
          test -s .gitignore
          test -s alpha.txt

